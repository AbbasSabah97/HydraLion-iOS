name: HydraLion iOS IPA

on:
  push:
    paths:
      - 'HydraLion/**'
      - 'HydraLion.xcodeproj/**'
      - 'DesignReferences/**'
      - '.github/workflows/ios-ipa.yml'
  pull_request:
    paths:
      - 'HydraLion/**'
      - 'HydraLion.xcodeproj/**'
      - 'DesignReferences/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

# Keep only the newest build in the queue for each branch.
# A rapid series of updates must not accumulate duplicate macOS builds.
concurrency:
  group: hydralion-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and report version
        run: |
          xcodebuild -version
          test -d HydraLion.xcodeproj
          test -d HydraLion/Assets.xcassets
      - name: Verify uploaded character images
        run: |
          for name in MascotIdle MascotBlink MascotDrink MascotCheers MascotSurprised MascotRelax; do
            test -s "HydraLion/Assets.xcassets/$name.imageset/$name.png" || {
              echo "Missing $name.png (use the complete zip provided with the app)"; exit 1;
            }
          done
      # The device archive below already compiles all SwiftUI screens.
      # Skip the duplicate Simulator build to make IPA delivery substantially faster.
      - name: Archive iOS device app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project HydraLion.xcodeproj -scheme HydraLion -configuration Release \
            -destination 'generic/platform=iOS' -archivePath .build/HydraLion.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive | tee .build-device.log
      - name: Package unsigned IPA for subsequent signing
        run: |
          set -euo pipefail
          mkdir -p .build/Payload
          cp -R .build/HydraLion.xcarchive/Products/Applications/HydraLion.app .build/Payload/
          cd .build
          /usr/bin/zip -qry HydraLion-UNSIGNED.ipa Payload
          unzip -l HydraLion-UNSIGNED.ipa | grep -F 'Payload/HydraLion.app/'
      - name: Upload IPA for subsequent signing
        uses: actions/upload-artifact@v4
        with:
          name: HydraLion-iOS-unsigned
          path: |
            .build/HydraLion-UNSIGNED.ipa
          include-hidden-files: true
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HydraLion-build-diagnostics
          path: |
            .build-simulator.log
            .build-device.log
          if-no-files-found: ignore
