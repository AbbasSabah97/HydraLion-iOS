name: Build HydraLion Android APK

on:
  push:
    branches:
      - main
      - "android/**"
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android 11 compatible APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HydraLion-Android-v1.0.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HydraLion-Android-v1.0.0
          path: HydraLion-Android-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
