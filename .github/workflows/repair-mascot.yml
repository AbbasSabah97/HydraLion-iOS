name: Repair mascot transparent canvas
on:
  push:
    paths:
      - '.github/workflows/repair-mascot.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add generous transparent canvas below both shoes
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('HydraLion/Assets.xcassets/MascotIdle.imageset/MascotIdle.png')
          image=Image.open(src).convert('RGBA')
          # Normalize, rather than accumulate padding if an earlier job ran.
          alpha=image.getchannel('A')
          bounding=alpha.point(lambda v: 255 if v>180 else 0).getbbox()
          if bounding is not None:
              image=image.crop(bounding)
          left,top,right,bottom=64,32,64,180
          canvas=Image.new('RGBA',(image.width+left+right,image.height+top+bottom),(0,0,0,0))
          canvas.alpha_composite(image,(left,top))
          canvas.save(src,'PNG',optimize=True)
          assert canvas.getpixel((0,0))[3]==0
          assert canvas.getpixel((canvas.width//2,canvas.height-1))[3]==0
          print('Mascot canvas:',canvas.size,'transparent bottom margin:',bottom)
          project=Path('HydraLion.xcodeproj/project.pbxproj')
          settings=project.read_text()
          if settings.count('MARKETING_VERSION = 1.6.0;') == 2 and settings.count('CURRENT_PROJECT_VERSION = 8;') == 2:
              settings=settings.replace('MARKETING_VERSION = 1.6.0;','MARKETING_VERSION = 1.7.0;')
              settings=settings.replace('CURRENT_PROJECT_VERSION = 8;','CURRENT_PROJECT_VERSION = 9;')
              project.write_text(settings)
          PY
      - name: Commit padded mascot asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HydraLion/Assets.xcassets/MascotIdle.imageset/MascotIdle.png HydraLion.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Protect full mascot shoes with transparent canvas padding"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Launch final iPhone IPA build on the updated image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ios-ipa.yml -r main
