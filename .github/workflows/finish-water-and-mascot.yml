name: Finish mascot cleanup and release
on:
  push:
    paths:
      - '.github/workflows/finish-water-and-mascot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hydralion-mascot-finish
  cancel-in-progress: true

jobs:
  repair-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Smooth white plate below shoes with transparent alpha
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          asset=Path('HydraLion/Assets.xcassets/MascotIdle.imageset/MascotIdle.png')
          image=Image.open(asset).convert('RGBA')
          original=np.asarray(image)
          alpha=original[:,:,3]
          good_y,good_x=np.where(alpha>=35)
          assert len(good_y)>10000, "Original character is missing"
          left,top,right,bottom=int(good_x.min()),int(good_y.min()),int(good_x.max()+1),int(good_y.max()+1)
          image=image.crop((left,top,right,bottom))
          arr=np.asarray(image).copy()
          h,w=arr.shape[:2]
          yy,xx=np.ogrid[:h,:w]

          # Fade only the pale neutral-coloured shape that is visible below
          # the two sneaker soles. Never fade vibrant blue leather or trousers.
          color=arr[:,:,:3].astype(np.float32)
          light=color.mean(axis=2)
          chroma=color.max(axis=2)-color.min(axis=2)
          distance=np.abs(xx/w-0.5)
          foot_neutral=np.clip((light-120)/60,0,1)*np.clip((65-chroma)/38,0,1)
          start=0.945 + np.minimum(1,distance/0.28)*0.020
          fade=np.clip((yy/h-start)/(.999-start),0,1)
          local=np.clip((0.34-distance)/0.07,0,1)
          factor=1-fade*0.98*foot_neutral*local
          arr[:,:,3]=np.rint(arr[:,:,3]*factor).clip(0,255).astype(np.uint8)

          # A transparent safety margin stops any residual visible bottom row
          # from being rendered as an opaque white rectangle in SwiftUI.
          clean=Image.fromarray(arr,'RGBA')
          canvas=Image.new('RGBA',(w+64,h+166),(0,0,0,0))
          canvas.alpha_composite(clean,(32,18))
          canvas.save(asset,'PNG',optimize=True)
          assert canvas.getpixel((canvas.width//2,canvas.height-1))[3]==0
          assert canvas.getchannel('A').getextrema()[1]>220
          print('Cleaned mascot:',canvas.size,'from',image.size)

          pbx=Path('HydraLion.xcodeproj/project.pbxproj')
          data=pbx.read_text()
          assert data.count('MARKETING_VERSION = 1.7.0;')==2
          assert data.count('CURRENT_PROJECT_VERSION = 9;')==2
          data=data.replace('MARKETING_VERSION = 1.7.0;','MARKETING_VERSION = 1.8.0;')
          data=data.replace('CURRENT_PROJECT_VERSION = 9;','CURRENT_PROJECT_VERSION = 10;')
          pbx.write_text(data)
          print('Version: 1.8.0 (10)')
          PY
      - name: Publish repaired PNG and updated iPhone version
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HydraLion/Assets.xcassets/MascotIdle.imageset/MascotIdle.png HydraLion.xcodeproj/project.pbxproj
          git diff --cached --check
          git commit -m "Release HydraLion 1.8: clean shoe edge and deeper blue water"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
