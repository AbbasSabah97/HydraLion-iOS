name: Import complete transparent mascot asset
on:
  push:
    paths: ['.github/workflows/import-complete-mascot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-mascot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download full seated mascot and remove connected white backdrop
        env:
          SOURCE_IMAGE_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/9c9db27b-5b7a-4378-b463-5c92bdd8ead5/00789a13-d386-46b4-b413-b108093171f1/Edit__mascot_as_a_precise_character_preserving_outpaint__Pre.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjVjMmU0ODNlNWI3ZDc2NyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzUzNTg3NX0.LMKJL0TXwqqWiFv48o7Kk-863UQjN7kaRZV-6j8GPOw'
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          import io, os, urllib.request
          from collections import deque
          import numpy as np
          from PIL import Image, ImageDraw, ImageFilter
          source = urllib.request.urlopen(os.environ['SOURCE_IMAGE_URL'], timeout=50).read()
          image = Image.open(io.BytesIO(source)).convert('RGBA')
          arr = np.array(image)
          rgb = arr[:,:,:3].astype(np.int16)
          # Determine the white background; only flood-connected pixels are erased,
          # preserving isolated white details of shirt and sneakers.
          eligible = (rgb.min(axis=2) >= 241) & ((rgb.max(axis=2)-rgb.min(axis=2)) <= 18)
          from PIL import ImageDraw
          marker = Image.fromarray((eligible.astype(np.uint8)*255), 'L')
          # Fill near-white pixels connected to the border, without touching clothing.
          w,h = marker.size
          for point in ((0,0),(w-1,0),(0,h-1),(w-1,h-1)):
              if marker.getpixel(point) == 255:
                  ImageDraw.floodfill(marker, point, 127, thresh=0)
          flooded = np.asarray(marker)
          mask = Image.fromarray(np.where(flooded == 127, 0, 255).astype(np.uint8), 'L')
          mask = mask.filter(ImageFilter.GaussianBlur(0.7))
          arr[:,:,3] = np.minimum(arr[:,:,3], np.asarray(mask))
          completed = Image.fromarray(arr, 'RGBA')
          box = completed.getbbox()
          if box:
              completed = completed.crop(box)
          # High-resolution iconography with modest file size.
          completed.thumbnail((1400,1400), Image.Resampling.LANCZOS)
          target='HydraLion/Assets.xcassets/MascotIdle.imageset/MascotIdle.png'
          completed.save(target, 'PNG', optimize=True, compress_level=9)
          assert completed.getpixel((0,0))[3] == 0, 'Unexpected opaque background'
          print('Wrote transparent mascot:',completed.size,os.path.getsize(target))
          PY
      - name: Commit updated original image to repository
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HydraLion/Assets.xcassets/MascotIdle.imageset/MascotIdle.png
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Replace cropped mascot with complete transparent character"
            git push origin HEAD:main
          fi
